[project]
name = "civiimport"
description = "Import a Civitai image's full generation setup into ComfyUI: recipe, model downloads, and a ready-to-queue workflow built from vanilla core nodes."
version = "1.3.1"
authors = [{ name = "Sev Kiriouchine" }]
license = { file = "LICENSE" }
dependencies = ["requests"]

[project.urls]
Repository = "https://github.com/Kiriouchine/CiviImport"

# Comfy Registry metadata.
# LAST STEP BEFORE PUBLISHING: sign in at https://registry.comfy.org, create a
# publisher, and paste its id (everything after the @ on your profile) into
# PublisherId below. Pushing that change to main fires
# .github/workflows/publish.yml, which needs the REGISTRY_ACCESS_TOKEN secret.
# Note: [project].name is the immutable registry identifier — keep 'civiimport'.
[tool.comfy]
PublisherId = ""
DisplayName = "CiviImport — Civitai Import"
Icon = ""
