<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- CiviImport icon — Copyright (c) 2026 Sev Kiriouchine — SPDX-License-Identifier: MIT -->
  <title id="t">CiviImport</title>
  <desc id="d">An import arrow feeding a small node graph: a Civitai URL becomes a ComfyUI workflow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232E63"/>
      <stop offset="1" stop-color="#0A0E1C"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="24" y1="200" x2="196" y2="200">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="92" fill="url(#bg)"/>

  <!-- the URL arriving from outside -->
  <g fill="url(#arrow)">
    <rect x="24" y="174" width="104" height="52" rx="26"/>
    <path d="M116 142 L196 200 L116 258 Z"/>
  </g>

  <!-- wires first, so they tuck under the node edges -->
  <g stroke="#22D3EE" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M286 182 C 312 176, 304 112, 326 112"/>
    <path d="M286 218 C 312 224, 304 288, 326 288"/>
  </g>

  <!-- the workflow it becomes -->
  <g fill="#EEF2FF">
    <rect x="208" y="156" width="88" height="88" rx="24"/>
    <rect x="310" y="72" width="76" height="80" rx="22"/>
    <rect x="310" y="248" width="76" height="80" rx="22"/>
  </g>
</svg>
